.search{position:relative;flex:1;min-width:0}
.search input{width:100%;font:inherit;font-size:1rem;padding:11px 40px 11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.results{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgb(0 0 0/.18);max-height:min(70vh,560px);overflow-y:auto;padding:6px}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.rolebar{background:var(--warn-soft);color:var(--warn);font-size:.85rem;font-weight:600;text-align:center;padding:6px}
main{padding-block:16px 110px}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:1.65rem;line-height:1.2}
h2{font-size:1.2rem}
h3{font-size:1rem;margin:0;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.dash{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.dash aside{position:sticky;top:84px}}
.dash .col{display:flex;flex-direction:column;gap:16px;min-width:0}
.hello{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;align-self:flex-start}
.seg button{border:0;background:none;padding:9px 14px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0/.15)}
.btn{font-weight:600;border-radius:11px;padding:10px 16px;min-height:44px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mini{font-size:.85rem;font-weight:600;padding:6px 10px;min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.mini.danger{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:is(button,input,select,textarea,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0;min-height:44px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stats{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border-radius:12px;padding:10px 12px;background:var(--sunk);text-align:right;border:0;cursor:pointer;display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);font-weight:600}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.prog{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.teams{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.teams{grid-template-columns:repeat(2,minmax(0,1fr))}}
.team{--c:var(--t1);border:0;border-radius:14px;padding:14px;text-align:right;cursor:pointer;background:color-mix(in srgb,var(--c) 13%,var(--surface));border-top:5px solid var(--c);display:flex;flex-direction:column;gap:8px;min-height:118px}
.team b{font-family:var(--display);font-weight:400;font-size:1.2rem;color:color-mix(in srgb,var(--c) 75%,var(--fg))}
.team .prog{background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.team .prog i{background:var(--c)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions3 button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:1/1;padding:8px;border-radius:var(--r);border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;font:inherit}.actions3 button b{font-size:1.3rem;font-weight:600}.actions3 svg{width:40px;height:40px}
@media (min-width:700px){.actions3 button{aspect-ratio:auto;height:170px}}
.actions3 button[data-act=pick-sign]{background:#2f7a45;color:#fff}.actions3 button[data-act=pick-dep]{background:#1f5fbf;color:#fff}.actions3 button[data-act=pick-credit]{background:#c2570c;color:#fff}
.stats.sflex{display:flex;flex-wrap:wrap}.stats.sflex>.stat{flex:1 1 30%;min-width:96px}
.home-kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px}.kpi b{font-family:var(--display);font-size:3.4rem;line-height:1;font-weight:500;letter-spacing:-.04em}.kpi span{color:var(--muted);font-size:1rem}
.c1{--c:var(--t1)}.c2{--c:var(--t2)}.c3{--c:var(--t3)}.c4{--c:var(--t4)}.c5{--c:var(--t5)}.c6{--c:var(--t6)}.c7{--c:var(--t7)}.c8{--c:var(--t8)}
.quick{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:64px}
.quick b{font-weight:600}
.quick span{font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;text-align:right;width:100%;cursor:pointer;min-height:56px}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-h{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em;padding:8px 10px 4px}
.res{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;width:100%;background:none;border:0;text-align:right}
.res:hover,.res:focus-visible{background:var(--sunk)}
.res .grow{flex:1;min-width:0}
.serial{font-family:var(--mono);font-size:.88rem;letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;padding:4px 0;min-height:36px;align-self:flex-start}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sold-head{border-top:5px solid var(--c)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:.75rem;color:var(--muted);font-weight:600}
.kv b{font-weight:600}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px 10px 10px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.on{background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.tick{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:transparent}
.tick svg{width:28px;height:28px}
.item.on .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.item .nm{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:.82rem}
.match{background:var(--info-soft);color:var(--info);border-radius:8px;padding:2px 8px;font-weight:600}
.sigbox{--paper:#ffffff;border:2px dashed var(--line);border-radius:14px;background:var(--paper);position:relative;touch-action:none;height:190px}
.sigbox canvas{width:100%;height:100%;display:block;border-radius:12px;cursor:crosshair}

function scribble(seed){
  const c=document.createElement("canvas"); c.width=360; c.height=120; const x=c.getContext("2d");
  let r=seed*9301+49297; const rnd=()=>((r=(r*9301+49297)%233280)/233280);
  x.strokeStyle="#16233a"; x.lineWidth=3; x.lineCap="round"; x.lineJoin="round"; x.beginPath();
  let px=40+rnd()*30; x.moveTo(px,70);
  for(let i=0;i<16;i++){ const nx=px+12+rnd()*16, ny=40+rnd()*50; x.quadraticCurveTo(px+(nx-px)/2, ny-30+rnd()*60, nx, ny); px=nx; }
  x.stroke(); x.beginPath(); x.moveTo(50,95); x.quadraticCurveTo(160,85+rnd()*10,px,92); x.stroke();
  return c.toDataURL("image/png");
}

const REPORTS = {r1:"דוח 1",zalam:"דוח צל״ם",credit:"מה חסר בזיכוי",deps:"הפקדות",log:"יומן פעולות",comm:"דוח קשר",weapon:"נשקים",veh:"רכבים",roles:"תפקידים והסמכות"};

function repTitle(k){ const [b,t]=String(k).split(":"); return (REPORTS[b]||b)+(t?" – "+team(t).name:""); }
function reportData(kk){
  const [k,tid]=String(kk).split(":"); const inT=s=>!tid||s?.team===tid; const SOL=S.soldiers.filter(inT);

    const E=[...S.docs.filter(d=>inT(sol((d.to||d.soldier).id))||!tid).map(d=>[d.at,d.by||"",K[d.kind]||d.kind,`${d.kind==="transfer"?d.from.name+" ← "+d.to.name:(d.to||d.soldier).name} · ${d.items.length===1?(d.items[0].type||d.items[0].name)+" "+(d.items[0].serial||""):d.items.length+" פריטים"}`]),

      ...S.r1.log.filter(r=>!tid||inT(sol(r.soldier))).map(r=>[r.at,r.by||"","דוח 1",`${sol(r.soldier)?.name||""} · ${r.date} · ${S.r1.statuses.find(x=>x.id===r.status)?.name||r.status}${r.note?" · "+r.note:""}`])]

/* ============ signature pad ============ */
function mountSig(id, key){
  const cv=document.getElementById(id); if(!cv) return null;
  const box=cv.parentElement; const r=box.getBoundingClientRect(); const dpr=Math.max(1,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  const x=cv.getContext("2d"); x.scale(dpr,dpr); x.lineWidth=2.6; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#14213a"; x.fillStyle="#14213a";
  const hint=box.querySelector(".hint");
  if(draftSig[key]){ const img=new Image(); img.onload=()=>x.drawImage(img,0,0,r.width,r.height); img.src=draftSig[key]; if(hint) hint.hidden=true; }
  let down=false, lx=0, ly=0;
  const pt=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  cv.onpointerdown=e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); down=true; [lx,ly]=pt(e); x.beginPath(); x.arc(lx,ly,1.2,0,7); x.fill(); if(hint) hint.hidden=true; };
  cv.onpointermove=e=>{ if(!down) return; const [nx,ny]=pt(e); x.beginPath(); x.moveTo(lx,ly); x.lineTo(nx,ny); x.stroke(); lx=nx; ly=ny; };
  cv.onpointerup=cv.onpointercancel=()=>{ if(!down) return; down=false; draftSig[key]=cv.toDataURL("image/png"); };
  return cv;
}
function sigData(key){
  const d=draftSig[key]; if(!d) return Promise.resolve(null);
  return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const w=480, hh=Math.round(img.height*w/img.width); const c=document.createElement("canvas"); c.width=w; c.height=hh; c.getContext("2d").drawImage(img,0,0,w,hh); res(c.toDataURL("image/png")); }; img.src=d; });
}

/* ---------- photos of the gear, attached to the signed document ---------- */
const draftPh={};
function photoBox(k,label){ const L=draftPh[k]||[]; return `<div class="photos" style="display:flex;flex-direction:column;gap:6px"><div class="row"><label class="btn ghost" style="cursor:pointer">📷 ${h(label||"צילום הציוד")}<input type="file" accept="image/*" capture="environment" data-photo="${k}" hidden></label><span class="small muted">${L.length?L.length+" תמונות יצורפו למסמך":"עד 3 תמונות, מצורפות למסמך החתום"}</span></div><div class="row" id="ph-${k}" style="gap:6px">${L.map((u,i)=>`<span style="position:relative"><img src="${u}" alt="" style="width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><button class="mini danger" data-act="photo-del" data-k="${k}" data-i="${i}" style="position:absolute;top:-6px;left:-6px;min-height:24px;padding:0 6px">×</button></span>`).join("")}</div></div>`; }
function refreshPh(k){ const el=document.querySelector(`[data-photo="${k}"]`)?.closest(".photos"); if(el) el.outerHTML=photoBox(k,el.querySelector("label").textContent.replace("📷","").trim()); }
async function shrinkPhoto(file){ const url=URL.createObjectURL(file); try{ const img=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
  const m=900, r=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height);

/* ============ events ============ */
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) { if(!e.target.closest("#searchWrap")) $("#results").hidden=true; return; }
  const A=el.dataset.act, D=el.dataset;
  if(A==="sheet-close-bg"){ if(e.target===el) closeSheet(); return; }
  if(el.closest("#results")) closeSearch();
  const c=cur();
  switch(A){
    case "tab": goRoot(D.v); break;
    case "back": back(); break;
    case "team": go("team",{id:D.id}); break;
    case "team-swap": c.id=D.id; c.f="all"; render(); break;
    case "team-f": c.f=D.f; render(); break;
    case "soldier": closeSheet(); go("soldier",{id:D.id}); break;
    case "asset": closeSheet(); go("asset",{id:D.id}); break;
    case "docs": go("docs",{}); break;
    case "docs-f": c.f=D.f; render(); break;
    case "settings": go("settings",{}); if(D.sec) setTimeout(()=>document.getElementById("sec-"+D.sec)?.scrollIntoView({behavior:"smooth"}),50); break;
    case "phase": S.phase=D.p; save(); render(true); toast(PH[D.p]+": "+({draft:"ההחתמות בראש המסך",ongoing:"הניהול השוטף בראש המסך",credit:"הזיכויים בראש המסך"})[D.p]); break;
    case "jump-rail": $("#rail").scrollIntoView({behavior:"smooth"}); break;
    case "sign-filter": goRoot("sign",{f:D.f}); break;
    case "sign-f": c.f=D.f; render(); break;
    case "credit-f": goRoot("credit"); cur().f=D.f; render(); break;
    case "credit-team": goRoot("credit"); cur().t=D.t; render(); break;
    case "next-credit": { const L=soldiersSorted(S.soldiers); const cid=c.v==="soldier"?c.id:null; const i0=Math.max(0,L.findIndex(x=>x.id===cid)); const s=[...L.slice(i0+1),...L.slice(0,i0+1)].find(x=>x.id!==cid&&["none","part"].includes(cStatus(x).k)); if(s){ if(c.v==="soldier") c.id=s.id, render(true); else go("soldier",{id:s.id}); } else toast("כל החיילים זוכו"); break; }
    case "rep-credit": goRoot("reports"); cur().k="credit"; cur().t="all"; render(); break;
    case "sign-t": c.t=D.t; render(); break;
    case "next-unsigned": { const L=soldiersSorted(S.soldiers); const s=L.find(s=>["sig","missing"].includes(sStatus(s).k))||L.find(s=>sStatus(s).k==="none"); if(s) go("soldier",{id:s.id}); else toast("כל החיילים הושלמו"); break; }
    case "gear": { if(c.v==="gear"){ c.cat=D.cat; c.f=D.f||"all"; render(); } else goRoot("gear",{cat:D.cat,f:D.f}); break; }
    case "gear-f": c.f=D.f; render(); break;
    case "gear-t": c.t=D.t; render(); break;
    case "tick": { const s=sol(D.s), it=s.items.find(i=>i.id===D.i); if(it.signedDoc&&it.checked){ toast("הפריט כבר חתום. כדי לשנות, לחצו ⋯ ליד הפריט"); break; } it.checked=!it.checked; save(); render(); break; }
    case "check-all": sol(D.id).items.forEach(i=>i.checked=true); save(); render(); break;
    case "apply-tpl": applyTemplate(sol(D.id)); save(); render(); break;
    case "arrived": sol(D.id).arrived=dayKey(); save(); render(); break;
    case "sig-clear": delete draftSig[D.id]; render(); break;
    case "sign-save": { const s=sol(D.id); const sg=await sigData(D.id); if(!sg){ toast("החייל עוד לא חתם בתיבה"); document.getElementById("sigSec").scrollIntoView({behavior:"smooth"}); break; }
      const d=makeSignDoc(s,sg); d.photos=takePh("sg-"+s.id); delete draftSig[D.id]; save(); render(); toast(`נשמר: ${d.items.length} פריטים חתומים, ${fmtTime(d.at)}`); break; }
    case "stickers": stickerSheet(D.cat||"weapon",D.t||"all"); break;
    case "stickers-pdf": { const cats=[...($("#st-w").checked?["weapon"]:[]),...($("#st-z").checked?["zalam"]:[])]; const tid=$("#st-team").value; const L=stickerList(tid,cats);
      if(!L.length){ toast("אין פריטים משויכים לחיילים בבחירה הזו"); break; } closeSheet();
      await busy(`מכין ${L.length} מדבקות…`, async()=>{ await offer(`מדבקות_${tid==="all"?"כל_הצוותים":team(tid).name}_${dayKey()}.pdf`.replace(/[\\/:*?"<>| ]/g,"_"), await stickersPdf(L)); }); break; }
    case "pdf": { const d=S.docs.find(x=>x.id===D.id); await busy("מכין PDF…", async()=>{ await offer(docFileName(d), await pdfFor([d])); }); break; }
    case "pdf-zip": { const list=docsFiltered(c.f||"all");
      await busy(`מכין ${list.length} מסמכים…`, async()=>{ const z=new JSZip(); for(const d of list){ z.file(docFileName(d), await pdfFor([d])); } await offer(`מסמכי_החתמות_${S.company.name}_${dayKey()}.zip`, await z.generateAsync({type:"blob"})); }); break; }
    case "pdf-merged": { const list=docsFiltered(c.f||"all").slice().reverse();
      await busy(`מכין ${list.length} עמודים…`, async()=>{ await offer(`מסמכי_החתמות_${S.company.name}_${dayKey()}.pdf`, await pdfFor(list)); }); break; }
    case "item-menu": { const s=sol(D.s); itemSheet(s, s.items.find(i=>i.id===D.i)); break; }
    case "add-item": itemSheet(sol(D.id),null); break;
    case "quick-item": $("#it-name").value=D.n; $("#it-serial").focus(); break;
    case "item-save": itemSave(D.s,D.i); break;
    case "item-del": { const s=sol(D.s), it=s.items.find(i=>i.id===D.i); const a=asset(it.assetId);
      if(a&&a.holder===s.id){ closeSheet(); returnFlow(a); } else { s.items=s.items.filter(i=>i.id!==it.id); save(); closeSheet(); render(); } break; }
    case "swap-asset": { const s=sol(D.s); swapAsset(s, s.items.find(i=>i.id===D.i)); break; }
    case "swap-to": case "swap-typed": { const s=sol(D.s), it=s.items.find(i=>i.id===D.i), old=asset(it.assetId);
      let a = A==="swap-to" ? asset(D.a) : null;
      if(A==="swap-typed"){ const v=$("#swq").value.trim(); if(!v){ toast("הקלידו מספר"); break; }
        a=S.assets.find(x=>norm(x.serial)===norm(v)); if(a&&a.holder&&a.holder!==s.id){ toast(`המספר רשום אצל ${sol(a.holder).name}. העבירו אותו מכרטיס הפריט.`); break; }
        if(!a){ a={id:uid("a"),cat:old.cat,type:old.type,serial:v,holder:null,status:"ok",note:"",history:[]}; S.assets.push(a); } }
      if(old) old.holder=null; a.holder=s.id; it.assetId=a.id; it.signedDoc=null; save(); closeSheet(); render(); toast("המספר עודכן"); break; }
    case "transfer": transferFlow(asset(D.id)); break;
    case "pick": pick.cb(sol(D.id)); break;
    case "transfer-save": await transferSave(D.a,D.to); break;
    case "return": returnFlow(asset(D.id)); break;
    case "night-mark": try{ localStorage.setItem("night:"+dayKey()+":"+D.k,"1"); }catch(_){} setTimeout(()=>render(),400); return;
    case "night-open": sheet(`<div class="row between"><h2>עדכון צל״ם</h2><button class="mini" data-act="sheet-close">סגירה</button></div>`+nightCard(true).replace('<section class="card" id="night">','<section>')); break;
    case "photo-del": (draftPh[D.k]||[]).splice(+D.i,1); refreshPh(D.k); break;
    case "photo-view": { const d=S.docs.find(x=>x.id===D.d); sheet(`<div class="row between"><h2>תמונה מהמסמך</h2><button class="mini" data-act="sheet-close">סגירה</button></div><img src="${d.photos[+D.i]}" alt="" style="width:100%;border-radius:10px"><p class="small muted" style="margin:0">${fmtTime(d.at)}${d.by?" · "+h(d.by):""}</p>`); break; }
    case "deposit": case "withdraw": case "credit": depFlow(A,D.s,D.i); break;
    case "pick-sign": soldierPicker("החתמת חייל",null,s=>{ closeSheet(); go("soldier",{id:s.id}); setTimeout(()=>$("#eq")?.scrollIntoView({block:"start"}),60); }); break;
    case "pick-dep": soldierPicker("הפקדה: מי מפקיד?",null,s=>{ closeSheet(); if(!s.items.some(i=>i.signedDoc&&!i.dep)){ toast("אין לחייל ציוד חתום להפקדה"); return; } depFlow("deposit",s.id); }); break;
    case "pick-credit": soldierPicker("זיכוי חייל",null,s=>{ closeSheet(); depFlow("credit",s.id); }); break;
    case "dep-save": await depSave(D.k,D.s,D.to); break;
    case "move": soldierPicker("העברה אל…",D.s,to=>{ closeSheet(); depFlow("move",D.s,D.i,to.id); }); break;
    case "return-save": await returnSave(D.a); break;
    case "astat": { const a=asset(D.id); if(a.status===D.s) break; if(D.s==="ok"){ setStatus(a,"ok",""); render(); break; }
      sheet(`<h2>סימון כ${ASTAT[D.s][0]}</h2><label class="f">${D.s==="faulty"?"מה התקלה":"לאן נשלח ומה התקלה"}<input id="st-note" value="${h(a.note)}"></label><div class="row"><button class="btn" data-act="astat-save" data-id="${a.id}" data-s="${D.s}">שמירה</button><button class="btn ghost" data-act="sheet-close">ביטול</button></div>`); break; }
    case "astat-save": setStatus(asset(D.id),D.s,$("#st-note").value.trim()); closeSheet(); render(); break;
    case "add-asset": sheet(`<div class="row between"><h2>הוספת ${CAT[D.cat]} למלאי</h2><button class="mini" data-act="sheet-close">סגירה</button></div><div class="fgrid"><label class="f">סוג<input id="na-type" list="types" value="${D.cat==="weapon"?"M4":"כוונת מפרו"}"></label><label class="f">מספר<input id="na-serial" class="serial" style="text-align:right"></label></div><datalist id="types">${[...new Set(S.assets.filter(a=>a.cat===D.cat).map(a=>a.type))].map(t=>`<option value="${h(t)}">`).join("")}</datalist><button class="btn" data-act="add-asset-save" data-cat="${D.cat}">הוספה</button>`); break;
    case "add-asset-save": { const t=$("#na-type").value.trim(), sr=$("#na-serial").value.trim(); if(!t||!sr){ toast("חסר סוג או מספר"); break; } if(S.assets.some(a=>norm(a.serial)===norm(sr))){ toast("המספר כבר קיים במלאי"); break; } S.assets.push({id:uid("a"),cat:D.cat,type:t,serial:sr,holder:null,status:"ok",note:"",history:[]}); save(); closeSheet(); render(); toast("נוסף למלאי"); break; }
    case "edit-soldier": soldierSheet(sol(D.id)); break;
    case "add-soldier": soldierSheet(null,D.team); break;
    case "soldier-save": { const name=$("#so-name").value.trim(); if(!name){ toast("חסר שם"); break; }
      const v={name,pn:$("#so-pn").value.trim(),team:$("#so-team").value,role:$("#so-role").value.trim(),phone:$("#so-phone").value.trim(),arrived:$("#so-arr").value,bday:$("#so-bday").value,quals:$("#so-quals").value.split(",").map(x=>x.trim()).filter(Boolean)};
      if(D.id){ Object.assign(sol(D.id),v); save(); closeSheet(); render(); }
      else { const s={id:uid("s"),...v,items:[]}; applyTemplate(s); S.soldiers.push(s); save(); closeSheet(); go("soldier",{id:s.id}); }
      break; }
    case "soldier-del": $("#so-confirm").innerHTML=`<div class="note">למחוק את ${h(sol(D.id).name)}? הציוד שלו יחזור למחסן, והמסמכים החתומים יישמרו. <button class="link" data-act="soldier-del-yes" data-id="${D.id}">כן, למחוק</button></div>`; break;
    case "soldier-del-yes": S.assets.forEach(a=>{ if(a.holder===D.id) a.holder=null; }); S.soldiers=S.soldiers.filter(s=>s.id!==D.id); save(); closeSheet(); back(); break;
    case "edit-vehicle": vehicleSheet(S.vehicles.find(v=>v.id===D.id)); break;
    case "vehicle-save": { const v={type:$("#v-type").value.trim(),plate:$("#v-plate").value.trim(),driver:$("#v-driver").value,status:$("#v-status").value,note:$("#v-note").value.trim()}; if(!v.type){ toast("חסר סוג רכב"); break; }
      if(D.id) Object.assign(S.vehicles.find(x=>x.id===D.id),v); else S.vehicles.push({id:uid("v"),...v}); save(); closeSheet(); render(); break; }
    case "vehicle-del": S.vehicles=S.vehicles.filter(v=>v.id!==D.id); save(); closeSheet(); render(); break;
    case "r1-day": c.day=D.d; render(); break;
    case "r1-t": c.t=D.t; render(); break;
    case "r1-set": { if(r1Day(D.d)[D.s]===D.st) break; S.r1.log.push({id:uid("r"),date:D.d,soldier:D.s,status:D.st,note:r1Notes(D.d)[D.s]||"",at:new Date().toISOString(),by:r1By()}); save(); render(); break; }
    case "r1-note": { const s=sol(D.s); sheet(`<h2>הערה: ${h(s.name)}</h2><input id="r1n" value="${h(r1Notes(D.d)[D.s]||"")}" aria-label="הערה"><div class="row"><button class="btn" data-act="r1-note-save" data-s="${D.s}" data-d="${D.d}">שמירה</button><button class="btn ghost" data-act="sheet-close">ביטול</button></div>`); break; }
    case "r1-note-save": { const st=r1Day(D.d)[D.s]; if(!st){ toast("קודם בוחרים סטטוס"); break; } S.r1.log.push({id:uid("r"),date:D.d,soldier:D.s,status:st,note:$("#r1n").value.trim(),at:new Date().toISOString(),by:r1By()}); save(); closeSheet(); render(); break; }
    case "r1-copy": { const m=r1Day(D.d), y=r1Day(addDays(D.d,-1)); let n=0; S.soldiers.forEach(s=>{ if(!m[s.id]&&y[s.id]){ S.r1.log.push({id:uid("r"),date:D.d,soldier:s.id,status:y[s.id],note:"",at:new Date().toISOString(),by:r1By()+" (הועתק מאתמול)"}); n++; } }); save(); render(); toast(n?`הועתקו ${n} דיווחים`:"אין מה להעתיק"); break; }
    case "r1-copytext": { const m=r1Day(D.d), n=r1Notes(D.d); const L=soldiersSorted(S.soldiers);
      const parts=[`דוח 1 · ${S.company.name} · ${fullDay(D.d)}${S.company.callup?" · "+callupTxt(D.d):""}`, S.r1.statuses.map(x=>`${x.name}: ${L.filter(s=>m[s.id]===x.id).length}`).join(" | ")+` | לא דווח: ${L.filter(s=>!m[s.id]).length}`];
      [...S.r1.statuses.map(x=>[x.name,L.filter(s=>m[s.id]===x.id)]),["לא דווח",L.filter(s=>!m[s.id])]].forEach(([nm,g])=>{ if(g.length) parts.push(`\n*${nm} (${g.length})*\n`+g.map(s=>`${s.name} · ${team(s.team).name}${n[s.id]?" · "+n[s.id]:""}`).join("\n")); });
      const text=parts.join("\n");
      try{ await navigator.clipboard.writeText(text); toast("הדוח הועתק. אפשר להדביק בוואטסאפ"); }
      catch(_){ sheet(`<h2>העתקת הדוח</h2><p class="muted small" style="margin:0">ההעתקה האוטומטית לא זמינה כאן. סמנו את הטקסט והעתיקו.</p><textarea id="r1txt" style="min-height:240px" readonly>${h(text)}</textarea><button class="btn ghost" data-act="sheet-close">סגירה</button>`); $("#r1txt").select(); }
      break; }
    case "r1-csv-day": { const m=r1Day(D.d), n=r1Notes(D.d); await offer(`דוח1_${D.d}.csv`, csv([["תאריך","שם","מ״א","צוות","סטטוס","הערה"],...soldiersSorted(S.soldiers).map(s=>[D.d,s.name,s.pn,team(s.team).name,S.r1.statuses.find(x=>x.id===m[s.id])?.name||"לא דווח",n[s.id]||""])])); break; }
    case "r1-csv-all": { const dset=new Set(S.r1.log.map(e=>e.date)); if(S.company.callup){ for(let dd=S.company.callup; dd<=dayKey(); dd=addDays(dd,1)) dset.add(dd); } const days=[...dset].sort(); const rows=[["תאריך","יום","יום לצו","שם","מ״א","צוות","סטטוס סופי ליום","הערה"]];
      days.forEach(dd=>{ const m=r1Day(dd), n=r1Notes(dd); const wd=fullDay(dd).split(" ").slice(0,-1).join(" "), cn=callupN(dd); soldiersSorted(S.soldiers).forEach(s=>rows.push([fmtDay(dd),wd,cn===null?"":cn,s.name,s.pn,team(s.team).name,S.r1.statuses.find(x=>x.id===m[s.id])?.name||"לא דווח",n[s.id]||""])); });
      const log=[["תאריך הדיווח","שם","סטטוס","הערה","עודכן ב","עודכן ע״י"],...S.r1.log.slice().sort((a,b)=>a.at.localeCompare(b.at)).map(e=>[e.date,sol(e.soldier)?.name||"",S.r1.statuses.find(x=>x.id===e.status)?.name||e.status,e.note,fmtTime(e.at),e.by])];
      const z=new JSZip(); z.file("דוח1_סיכום_יומי.csv",csv(rows)); z.file("דוח1_יומן_כל_העדכונים.csv",csv(log)); await offer(`דוח1_היסטוריה_מלאה_${dayKey()}.zip`, await z.generateAsync({type:"blob"})); break; }
    case "rep": c.k=D.k; render(); break;
    case "rep-t": c.t=D.t; render(); break;
    case "rep-csv": { const d=reportData(D.k); await offer(`${repTitle(D.k).replace(/״/g,"").replace(/[ –]+/g,"_")}_${dayKey()}.csv`, csv([d.head,...d.rows])); break; }
    case "role": S.role=D.r; stack=[{v:ROLE_TABS[D.r][0]}]; render(true); break;
    case "role-admin": S.role="admin"; stack=[{v:"home"}]; render(true); break;
    case "tpl-add": S.template.push({id:uid("tp"),name:"פריט חדש",qty:1}); save(); render(); break;
    case "tpl-del": S.template=S.template.filter(t=>t.id!==D.id); save(); render(); break;
    case "tpl-up": { const i=+D.i; if(i>0){ [S.template[i-1],S.template[i]]=[S.template[i],S.template[i-1]]; save(); render(); } break; }
    case "tpl-apply": { let n=0; S.soldiers.forEach(s=>{ n+=applyTemplate(s); }); save(); toast(n?`נוספו ${n} פריטים לחיילים`:"לכל החיילים כבר יש את כל פריטי התבנית"); break; }
    case "backup": await offer(`גיבוי_${S.company.name}_${dayKey()}.json`, JSON.stringify(S)); break;
    case "wipe": sheet(`<h2>להתחיל פלוגה ריקה?</h2><p style="margin:0">כל נתוני הדוגמה יימחקו: חיילים, ציוד, מסמכים ודוח 1. הצוותים, התבנית והסטטוסים יישארו.</p><div class="row"><button class="btn danger" data-act="wipe-yes">כן, למחוק הכל</button><button class="btn ghost" data-act="sheet-close">ביטול</button></div>`); break;
    case "wipe-yes": Object.assign(S,{soldiers:[],assets:[],docs:[],vehicles:[],sample:false}); S.r1.log=[]; save(); closeSheet(); goRoot("home"); break;
    case "reseed": { const keep=S; seed(); S.role=keep.role; save(); goRoot("home"); toast("נתוני הדוגמה נטענו"); break; }
    case "asset-edit": { const a=asset(D.id); sheet(`<div class="row between"><h2>עריכת פריט</h2><button class="mini" data-act="sheet-close">סגירה</button></div><div class="fgrid"><label class="f">סוג<input id="ae-type" value="${h(a.type)}"></label><label class="f">מספר<input id="ae-serial" dir="ltr" value="${h(a.serial)}"></label></div><button class="btn" data-act="asset-edit-save" data-id="${a.id}">שמירה</button>`); break; }
    case "asset-edit-save": { const a=asset(D.id), t=$("#ae-type").value.trim(), sr=$("#ae-serial").value.trim(); if(!t||!sr){ toast("חסר סוג או מספר"); break; }
      if(sr!==a.serial && S.assets.some(x=>x!==a&&x.cat===a.cat&&x.serial===sr)){ toast("המספר הזה כבר קיים במלאי"); break; }
      a.history.unshift({by:actor(),at:new Date().toISOString(),kind:"status",status:a.status,note:`עודכן: ${a.type} ${a.serial} ← ${t} ${sr}`}); a.type=t; a.serial=sr; save(); closeSheet(); render(); toast("נשמר"); break; }
    case "logo-del": S.company.logo=""; save(); render(); break;
    case "login": await login(); break;
    case "login-pw": case "signup-pw": { const em=($("#lg-email")?.value||"").trim(), pw=$("#lg-pass")?.value||"";
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast("כתובת המייל לא תקינה"); break; }
      if(pw.length<6){ toast("הסיסמה צריכה לפחות 6 תווים"); break; }
      try{ if(A==="login-pw") await signInWithEmailAndPassword(auth,em,pw); else { const c=await createUserWithEmailAndPassword(auth,em,pw); await sendEmailVerification(c.user); } }
      catch(e){ toast({"auth/invalid-credential":"מייל או סיסמה שגויים","auth/wrong-password":"מייל או סיסמה שגויים","auth/user-not-found":"אין חשבון עם המייל הזה. לחצו ״יצירת חשבון״","auth/email-already-in-use":"כבר יש חשבון עם המייל הזה. לחצו ״כניסה״","auth/too-many-requests":"יותר מדי ניסיונות. נסו שוב בעוד כמה דקות","auth/operation-not-allowed":"הכניסה עם סיסמה עוד לא הופעלה"}[e.code]||"הכניסה לא הצליחה",5000); } break; }
    case "reset-pw": { const em=($("#lg-email")?.value||"").trim(); if(!em){ toast("כתבו קודם את כתובת המייל"); break; }

async function enterCompany(c){

}
